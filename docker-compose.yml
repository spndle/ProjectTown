services:
  projecttown:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PROJECTTOWN_DATABASE_PATH: /app/data/projecttown.db
      PROJECTTOWN_SANDBOX_ROOT: /app/sandbox
      PROJECTTOWN_API_PREFIX: "${PROJECTTOWN_API_PREFIX:-/api/v1}"
      PROJECTTOWN_MAX_WORKERS: "${PROJECTTOWN_MAX_WORKERS:-4}"
      PROJECTTOWN_MAX_FILE_BYTES: "${PROJECTTOWN_MAX_FILE_BYTES:-1000000}"
      PROJECTTOWN_DEBUG: "${PROJECTTOWN_DEBUG:-false}"
      PROJECTTOWN_RUNTIME_API_PREFIX: "${PROJECTTOWN_RUNTIME_API_PREFIX:-/api/v2}"
      PROJECTTOWN_RUNTIME_MAX_WORKERS: "${PROJECTTOWN_RUNTIME_MAX_WORKERS:-2}"
      PROJECTTOWN_EXECUTION_LEASE_SECONDS: "${PROJECTTOWN_EXECUTION_LEASE_SECONDS:-30}"
      PROJECTTOWN_WEBSOCKET_POLL_SECONDS: "${PROJECTTOWN_WEBSOCKET_POLL_SECONDS:-0.1}"
      PROJECTTOWN_WATCHDOG_THRESHOLD: "${PROJECTTOWN_WATCHDOG_THRESHOLD:-3}"
      PROJECTTOWN_TOOL_ALLOWLIST: "${PROJECTTOWN_TOOL_ALLOWLIST:-check_markdown,check_python_syntax,list_directory,read_file,write_file}"
      PROJECTTOWN_HIGH_RISK_TOOLS: "${PROJECTTOWN_HIGH_RISK_TOOLS:-}"
      PROJECTTOWN_ENABLE_V1_RUNTIME: "${PROJECTTOWN_ENABLE_V1_RUNTIME:-true}"
      PROJECTTOWN_VERSION: "${PROJECTTOWN_VERSION:-1.0.0}"
    volumes:
      - projecttown-data:/app/data
      - projecttown-sandbox:/app/sandbox
    user: "10001:10001"
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  projecttown-data:
  projecttown-sandbox:
