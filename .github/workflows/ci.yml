name: ci
on: [push, pull_request]
jobs:
  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check backend tests scripts
      - run: python -m compileall -q backend scripts
      - name: Prepare protected pytest base temp
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $parent = Join-Path $PWD "sandbox/tmp/ci-pytest-parent"
          New-Item -ItemType Directory -Path $parent -Force | Out-Null
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $currentSid = $identity.User.Value
          & "$env:SystemRoot\System32\icacls.exe" $parent /inheritance:r /grant:r "*${currentSid}:(OI)(CI)F" /remove:g "OWNER RIGHTS"
          if ($LASTEXITCODE -ne 0) {
            throw "icacls failed while protecting pytest base temp: $LASTEXITCODE"
          }
          $acl = Get-Acl -LiteralPath $parent
          $allowedSids = @($currentSid, "S-1-5-18", "S-1-5-32-544")
          $unexpectedAllowSids = @(
            $acl.Access |
              Where-Object { $_.AccessControlType -eq "Allow" } |
              ForEach-Object {
                $_.IdentityReference.Translate([Security.Principal.SecurityIdentifier]).Value
              } |
              Where-Object { $_ -notin $allowedSids }
          )
          if (-not $acl.AreAccessRulesProtected -or $unexpectedAllowSids) {
            throw "pytest base temp ACL guard failed: protected=$($acl.AreAccessRulesProtected) unexpected=$($unexpectedAllowSids -join ',')"
          }
          $runnerTemp = (Resolve-Path -LiteralPath $env:RUNNER_TEMP).Path
          $systemTemp = Join-Path $runnerTemp "projecttown-ci-system-temp"
          New-Item -ItemType Directory -Path $systemTemp -Force | Out-Null
          & "$env:SystemRoot\System32\icacls.exe" $systemTemp /inheritance:r /grant:r "*${currentSid}:(OI)(CI)F" /remove:g "OWNER RIGHTS"
          if ($LASTEXITCODE -ne 0) {
            throw "icacls failed while protecting system temp: $LASTEXITCODE"
          }
          $canonicalSystemTemp = (Resolve-Path -LiteralPath $systemTemp).Path
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path.TrimEnd('\')
          if ($canonicalSystemTemp -eq $workspace -or $canonicalSystemTemp.StartsWith("$workspace\", [StringComparison]::OrdinalIgnoreCase)) {
            throw "system temp must remain outside the repository"
          }
          "TEMP=$canonicalSystemTemp" >> $env:GITHUB_ENV
          "TMP=$canonicalSystemTemp" >> $env:GITHUB_ENV
          "TMPDIR=$canonicalSystemTemp" >> $env:GITHUB_ENV
      - name: Diagnose Local Settings ACL primitive
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $probe = Join-Path $env:TEMP ("projecttown-acl-probe-" + [Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Path $probe | Out-Null
          $probe = (Resolve-Path -LiteralPath $probe).Path
          $workspace = (Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE).Path.TrimEnd('\')
          if ($probe -eq $workspace -or $probe.StartsWith("$workspace\", [StringComparison]::OrdinalIgnoreCase)) {
            throw "ACL probe must remain outside the repository"
          }
          try {
            $env:PROJECTTOWN_ACL_PROBE_PATH = $probe
            python -c "import os, subprocess, sys; from pathlib import Path; from backend.app import local_settings as settings; probe = Path(os.environ['PROJECTTOWN_ACL_PROBE_PATH']); environment = {'SystemRoot': os.environ.get('SystemRoot', r'C:\Windows'), 'WINDIR': os.environ.get('WINDIR', r'C:\Windows'), 'PROJECTTOWN_LOCAL_SETTINGS_PATH': str(probe)}; completed = subprocess.run([r'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', '-NoProfile', '-NonInteractive', '-Command', settings._windows_acl_restrict_script(True)], stdin=subprocess.DEVNULL, timeout=3, check=False, env=environment); raise SystemExit(completed.returncode)"
            if ($LASTEXITCODE -ne 0) { throw "Local Settings ACL primitive probe failed: $LASTEXITCODE" }
          }
          finally {
            Remove-Item -LiteralPath $probe -Recurse -Force
            Remove-Item Env:PROJECTTOWN_ACL_PROBE_PATH -ErrorAction SilentlyContinue
          }
      - run: python -m pytest -q --basetemp=sandbox/tmp/ci-pytest-parent/run -ra --cov=backend --cov-report=term-missing --cov-fail-under=80
  linux-platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-dev.txt
      - name: Prepare pytest base temp
        run: python -c "from pathlib import Path; Path('sandbox/tmp').mkdir(parents=True, exist_ok=True)"
      - name: Run Linux security and platform allowlist
        run: >-
          python -m pytest -q -ra --basetemp=sandbox/tmp/linux-platform
          --junitxml=sandbox/tmp/linux-platform.xml
          tests/unit/test_local_settings.py
          tests/integration/test_v3_usability_trials_cli.py::test_reparse_candidate_manifest_rejects_without_study_publication
          tests/unit/test_controlled_apply.py::test_rejects_reparse_target_when_supported
          tests/unit/test_controlled_apply.py::test_rejects_invalid_result_file_shapes
          tests/unit/test_executable_proposal.py::test_symlinked_external_proposal_is_rejected_when_supported
          tests/unit/test_manage_docker_local_settings.py::test_mirror_rejects_symlink_and_wide_permission_probe
          tests/unit/test_materials.py::test_symlink_unstable_and_no_leakage
          tests/unit/test_provider_secrets.py::test_local_file_missing_oversize_malformed_and_symlink_are_denied
          tests/unit/test_v1_provenance.py::test_snapshot_rejects_links_and_reparse_points
          tests/unit/test_v1_provenance.py::test_snapshot_rejects_special_files_when_supported
          tests/unit/test_v1_provenance.py::test_snapshot_reparse_is_rejected_with_cross_platform_monkeypatch
          tests/visual/test_harness.py::test_confined_rejects_symlink_escape_when_supported
      - name: Require Linux allowlist to have zero skips or errors
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          root = ET.parse("sandbox/tmp/linux-platform.xml").getroot()
          suites = [root] if root.tag == "testsuite" else root.findall(".//testsuite")
          totals = {
              name: sum(int(suite.get(name, "0")) for suite in suites)
              for name in ("tests", "failures", "errors", "skipped")
          }
          if totals["tests"] <= 0 or any(
              totals[name] for name in ("failures", "errors", "skipped")
          ):
              raise SystemExit(f"linux platform junit gate failed: {totals}")
          print(f"linux platform junit gate passed: {totals}")
          PY
